<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MaxChat</title>
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; }

        /* ─── LOGIN ─── */
        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: linear-gradient(180deg, #0a0a0a, #111); }
        .login-screen .avatar { font-size: 5em; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .login-screen h1 { font-size: 2em; color: #00ff88; margin-bottom: 5px; }
        .login-screen p { color: #666; margin-bottom: 30px; font-size: 0.9em; text-align: center; }
        .login-input { width: 100%; max-width: 300px; padding: 14px 18px; border: 2px solid #333; border-radius: 12px; background: #1a1a2e; color: #fff; font-size: 1em; outline: none; margin-bottom: 15px; }
        .login-input:focus { border-color: #00ff88; }
        .login-btn { width: 100%; max-width: 300px; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; font-size: 1em; font-weight: 600; cursor: pointer; }

        /* ─── MAIN ─── */
        .main-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
        .main-screen.active { display: flex; }

        .header { display: flex; align-items: center; padding: 12px 16px; background: #111; border-bottom: 1px solid #222; gap: 10px; }
        .header .avatar { font-size: 1.8em; }
        .header .info h2 { font-size: 1em; color: #fff; }
        .header .info .status { font-size: 0.7em; color: #00ff88; }
        .mode-btn { margin-left: auto; padding: 6px 14px; border: 1px solid #333; border-radius: 20px; background: transparent; color: #888; font-size: 0.75em; cursor: pointer; }
        .mode-btn.active { border-color: #00ff88; color: #00ff88; background: #00ff8815; }

        /* ─── VOICE (default) ─── */
        .voice-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; }
        
        .talk-btn {
            width: 130px; height: 130px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #0a0a0a; font-size: 3.2em; cursor: pointer;
            box-shadow: 0 4px 20px #00ff8840;
            transition: all 0.15s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .talk-btn:active { transform: scale(0.95); }
        .talk-btn.recording {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            box-shadow: 0 4px 20px #ff444440;
            animation: pulse-rec 1s infinite;
        }
        @keyframes pulse-rec { 0%,100%{box-shadow: 0 4px 20px #ff444440} 50%{box-shadow: 0 4px 30px #ff444480} }
        
        .talk-btn.thinking {
            background: linear-gradient(135deg, #ffd93d, #f0c000);
            box-shadow: 0 4px 20px #ffd93d40;
            animation: spin 2s linear infinite;
        }
        @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        
        .talk-btn.speaking {
            background: linear-gradient(135deg, #6b8aff, #4466ff);
            box-shadow: 0 4px 20px #6b8aff40;
            animation: pulse-speak 0.8s infinite;
        }
        @keyframes pulse-speak { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
        
        .talk-label { font-size: 0.95em; color: #888; text-align: center; min-height: 1.3em; transition: color 0.2s; }
        .talk-label.recording { color: #ff4444; }
        .talk-label.thinking { color: #ffd93d; }
        .talk-label.speaking { color: #6b8aff; }

        .transcript { font-size: 0.8em; color: #666; font-style: italic; text-align: center; min-height: 1em; max-width: 85%; }
        .last-reply { max-width: 85%; padding: 12px 16px; background: #1e1e3a; border-radius: 16px; border-bottom-left-radius: 4px; font-size: 0.85em; line-height: 1.4; color: #ccc; display: none; }
        .last-reply.visible { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* ─── CHAT ─── */
        .chat-area { display: none; flex: 1; flex-direction: column; }
        .chat-area.active { display: flex; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9em; line-height: 1.4; animation: msgIn 0.3s ease-out; word-wrap: break-word; }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .msg.user { align-self: flex-end; background: #00ff88; color: #0a0a0a; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: #1e1e3a; color: #e0e0e0; border-bottom-left-radius: 4px; }
        .msg .time { font-size: 0.65em; opacity: 0.5; margin-top: 4px; }
        .typing { align-self: flex-start; color: #666; font-size: 0.8em; padding: 8px 16px; }
        .typing-dots span { animation: dot 1.4s infinite; opacity: 0.3; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dot { 0%,100%{opacity:0.3} 50%{opacity:1} }
        .input-area { display: flex; align-items: center; padding: 10px 12px; background: #111; border-top: 1px solid #222; gap: 8px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #333; border-radius: 24px; background: #1a1a2e; color: #fff; font-size: 0.9em; outline: none; }
        .input-area input:focus { border-color: #00ff88; }
        .send-btn { width: 44px; height: 44px; border: none; border-radius: 50%; background: #00ff88; color: #0a0a0a; font-size: 1.1em; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="avatar">📚</div>
    <h1>MaxChat</h1>
    <p>Habla con Max — toca para hablar</p>
    <input class="login-input" id="nameInput" placeholder="Tu nombre..." maxlength="20" autofocus>
    <button class="login-btn" id="loginBtn">Entrar</button>
</div>

<div class="main-screen" id="mainScreen">
    <div class="header">
        <div class="avatar">📚</div>
        <div class="info">
            <h2>Max</h2>
            <div class="status" id="connStatus">Toca el botón para hablar</div>
        </div>
        <button class="mode-btn active" id="voiceModeBtn">🎤</button>
        <button class="mode-btn" id="chatModeBtn">💬</button>
    </div>

    <!-- VOICE MODE -->
    <div class="voice-area" id="voiceArea">
        <div class="transcript" id="transcript"></div>
        <button class="talk-btn" id="talkBtn">🎤</button>
        <div class="talk-label" id="talkLabel">Toca para hablar</div>
        <div class="last-reply" id="lastReply"></div>
    </div>

    <!-- CHAT MODE -->
    <div class="chat-area" id="chatArea">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="msgInput" placeholder="Escribe un mensaje...">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
const SERVER_URL = window.location.origin;
let userName = '';
let state = 'idle'; // idle, recording, transcribing, thinking, speaking
let mediaStream = null;
let mediaRecorder = null;
let audioChunks = [];
let currentAudio = null;
let lastReplyText = '';

const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const nameInput = document.getElementById('nameInput');
const loginBtn = document.getElementById('loginBtn');
const talkBtn = document.getElementById('talkBtn');
const talkLabel = document.getElementById('talkLabel');
const transcript = document.getElementById('transcript');
const lastReply = document.getElementById('lastReply');
const voiceArea = document.getElementById('voiceArea');
const chatArea = document.getElementById('chatArea');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const voiceModeBtn = document.getElementById('voiceModeBtn');
const chatModeBtn = document.getElementById('chatModeBtn');
const connStatus = document.getElementById('connStatus');

// ─── LOGIN ───
loginBtn.onclick = () => {
    const name = nameInput.value.trim();
    if (!name) return;
    userName = name;
    localStorage.setItem('maxchat_user', name);
    loginScreen.style.display = 'none';
    mainScreen.classList.add('active');
};
nameInput.onkeydown = e => { if(e.key==='Enter') loginBtn.click(); };
const saved = localStorage.getItem('maxchat_user');
if (saved) { nameInput.value = saved; loginBtn.click(); }

// ─── MODE TOGGLE ───
voiceModeBtn.onclick = () => {
    voiceModeBtn.classList.add('active');
    chatModeBtn.classList.remove('active');
    voiceArea.style.display = 'flex';
    chatArea.classList.remove('active');
};
chatModeBtn.onclick = () => {
    chatModeBtn.classList.add('active');
    voiceModeBtn.classList.remove('active');
    chatArea.classList.add('active');
    voiceArea.style.display = 'none';
};

// ─── VOICE: TAP ONCE TO RECORD ───
// Tap starts recording, auto-stops after 10s or tap again to stop early
talkBtn.onclick = async () => {
    if (state === 'idle') {
        await startRecording();
    } else if (state === 'recording') {
        await stopRecordingAndProcess();
    }
    // If thinking/transcribing/speaking, ignore taps
};

async function startRecording() {
    // Stop any playing audio
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    
    try {
        if (!mediaStream) {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
            });
        }
        
        audioChunks = [];
        const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
        mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
        
        mediaRecorder.ondataavailable = (e) => {
            if (e.data.size > 0) audioChunks.push(e.data);
        };
        
        mediaRecorder.start();
        state = 'recording';
        updateUI();
        
        // Auto-stop after 10 seconds
        setTimeout(() => {
            if (state === 'recording') stopRecordingAndProcess();
        }, 10000);
        
    } catch(e) {
        alert('Micrófono: ' + e.message);
    }
}

async function stopRecordingAndProcess() {
    if (state !== 'recording' || !mediaRecorder || mediaRecorder.state !== 'recording') {
        state = 'idle';
        updateUI();
        return;
    }
    
    return new Promise((resolve) => {
        mediaRecorder.onstop = async () => {
            const mimeType = audioChunks.length > 0 ? audioChunks[0].type || 'audio/webm' : 'audio/webm';
            const blob = new Blob(audioChunks, { type: mimeType });
            audioChunks = [];
            
            if (blob.size < 500) {
                state = 'idle';
                updateUI();
                transcript.textContent = 'Muy corto. Intenta de nuevo.';
                resolve();
                return;
            }
            
            // Step 1: Transcribe
            state = 'transcribing';
            updateUI();
            
            try {
                const reader = new FileReader();
                reader.onloadend = async () => {
                    const b64 = reader.result.split(',')[1];
                    
                    const trRes = await fetch(SERVER_URL + '/api/transcribe', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ audio: b64 })
                    });
                    const trData = await trRes.json();
                    const userText = (trData.text || '').trim();
                    
                    if (!userText) {
                        state = 'idle';
                        updateUI();
                        transcript.textContent = 'No detecté voz. Toca de nuevo.';
                        resolve();
                        return;
                    }
                    
                    transcript.textContent = '🎙️ "' + userText + '"';
                    addMsg('user', '🎙️ ' + userText);
                    
                    // Step 2: AI
                    state = 'thinking';
                    updateUI();
                    
                    const chatRes = await fetch(SERVER_URL + '/api/chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: userText, username: userName })
                    });
                    const chatData = await chatRes.json();
                    const reply = chatData.reply || 'Sin respuesta';
                    lastReplyText = reply;
                    addMsg('bot', reply);
                    lastReply.textContent = reply;
                    lastReply.classList.add('visible');
                    
                    // Step 3: TTS
                    state = 'speaking';
                    updateUI();
                    
                    try {
                        const ttsRes = await fetch(SERVER_URL + '/api/tts', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ text: reply, voice: 'es-MX-DaliaNeural' })
                        });
                        
                        if (ttsRes.ok) {
                            const audioBlob = await ttsRes.blob();
                            const audioUrl = URL.createObjectURL(audioBlob);
                            currentAudio = new Audio(audioUrl);
                            currentAudio.onended = () => {
                                currentAudio = null;
                                URL.revokeObjectURL(audioUrl);
                                state = 'idle';
                                updateUI();
                            };
                            currentAudio.onerror = () => {
                                currentAudio = null;
                                state = 'idle';
                                updateUI();
                            };
                            await currentAudio.play();
                        } else {
                            state = 'idle';
                            updateUI();
                        }
                    } catch(e) {
                        state = 'idle';
                        updateUI();
                    }
                    resolve();
                };
                reader.readAsDataURL(blob);
            } catch(e) {
                console.error('Voice error:', e);
                state = 'idle';
                updateUI();
                resolve();
            }
        };
        
        mediaRecorder.stop();
    });
}

function updateUI() {
    talkBtn.className = 'talk-btn';
    talkLabel.className = 'talk-label';
    
    switch(state) {
        case 'idle':
            talkBtn.textContent = '🎤';
            talkBtn.style.background = '';
            talkLabel.textContent = 'Toca para hablar';
            connStatus.textContent = 'Toca el botón para hablar';
            break;
        case 'recording':
            talkBtn.textContent = '⏹️';
            talkBtn.classList.add('recording');
            talkLabel.textContent = 'Grabando... toca para detener';
            talkLabel.classList.add('recording');
            connStatus.textContent = '🔴 Grabando';
            break;
        case 'transcribing':
            talkBtn.textContent = '✍️';
            talkBtn.classList.add('thinking');
            talkLabel.textContent = 'Transcribiendo...';
            talkLabel.classList.add('thinking');
            connStatus.textContent = '✍️ Transcribiendo';
            break;
        case 'thinking':
            talkBtn.textContent = '🧠';
            talkBtn.classList.add('thinking');
            talkLabel.textContent = 'Pensando...';
            talkLabel.classList.add('thinking');
            connStatus.textContent = '🧠 Pensando';
            break;
        case 'speaking':
            talkBtn.textContent = '🔊';
            talkBtn.classList.add('speaking');
            talkLabel.textContent = 'Respondiendo...';
            talkLabel.classList.add('speaking');
            connStatus.textContent = '🔊 Respondiendo';
            break;
    }
}

// ─── CHAT ───
sendBtn.onclick = sendMsg;
msgInput.onkeydown = e => { if(e.key==='Enter') sendMsg(); };

function sendMsg() {
    const text = msgInput.value.trim();
    if (!text) return;
    addMsg('user', text);
    msgInput.value = '';
    showTyping();
    
    fetch(SERVER_URL + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, username: userName })
    }).then(r => r.json()).then(d => {
        removeTyping();
        addMsg('bot', d.reply || 'Sin respuesta');
        lastReplyText = d.reply;
        lastReply.textContent = d.reply;
        lastReply.classList.add('visible');
    }).catch(() => {
        removeTyping();
        addMsg('bot', 'Error de conexión.');
    });
}

function addMsg(type, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + type;
    const t = new Date();
    d.innerHTML = text + '<div class="time">' + t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0') + '</div>';
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
    removeTyping();
    const t = document.createElement('div');
    t.className = 'typing';
    t.id = 'typingIndicator';
    t.innerHTML = '<div class="typing-dots"><span>●</span><span>●</span><span>●</span></div>';
    messagesEl.appendChild(t);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}
function removeTyping() { const t = document.getElementById('typingIndicator'); if(t) t.remove(); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

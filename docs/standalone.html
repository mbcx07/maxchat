<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MaxChat</title>
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; height: 100dvh; overflow: hidden; user-select: none; }

        .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: linear-gradient(180deg, #0a0a0a, #111); }
        .login-screen .avatar { font-size: 5em; margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
        .login-screen h1 { font-size: 2em; color: #00ff88; margin-bottom: 5px; }
        .login-screen p { color: #666; margin-bottom: 30px; font-size: 0.9em; text-align: center; }
        .login-input { width: 100%; max-width: 300px; padding: 14px 18px; border: 2px solid #333; border-radius: 12px; background: #1a1a2e; color: #fff; font-size: 1em; outline: none; margin-bottom: 15px; }
        .login-input:focus { border-color: #00ff88; }
        .login-btn { width: 100%; max-width: 300px; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; font-size: 1em; font-weight: 600; cursor: pointer; }

        .main-screen { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
        .main-screen.active { display: flex; }

        /* ─── CALL SCREEN (full screen) ─── */
        .call-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; gap: 20px; }
        .call-avatar { font-size: 6em; }
        .call-avatar.listening { animation: float 2s ease-in-out infinite; }
        .call-avatar.speaking { animation: pulse-voice 0.6s ease-in-out infinite; }
        @keyframes pulse-voice { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }

        .call-status { font-size: 1.1em; color: #888; text-align: center; min-height: 1.5em; transition: all 0.3s; }
        .call-status.listening { color: #00ff88; }
        .call-status.recording { color: #ff4444; }
        .call-status.thinking { color: #ffd93d; }
        .call-status.speaking { color: #6b8aff; }

        .transcript-box { max-width: 90%; padding: 10px 16px; background: #1e1e3a; border-radius: 12px; font-size: 0.85em; color: #aaa; text-align: center; min-height: 1.5em; font-style: italic; display: none; }
        .transcript-box.visible { display: block; animation: fadeIn 0.3s ease-out; }
        
        .reply-box { max-width: 90%; padding: 14px 18px; background: #1e1e3a; border-left: 3px solid #00ff88; border-radius: 12px; font-size: 0.9em; color: #e0e0e0; line-height: 1.5; display: none; }
        .reply-box.visible { display: block; animation: fadeIn 0.3s ease-out; }

        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        .wave-bars { display: flex; align-items: center; gap: 3px; height: 40px; }
        .wave-bars .bar { width: 4px; height: 10px; background: #00ff88; border-radius: 2px; transition: height 0.1s; }
        .wave-bars.active .bar { animation: wave 0.5s ease-in-out infinite; }
        .wave-bars.speaking .bar { background: #6b8aff; animation: wave 0.3s ease-in-out infinite; }
        @keyframes wave { 0%,100%{height:6px} 50%{height:30px} }
        .wave-bars .bar:nth-child(1){animation-delay:0s} .wave-bars .bar:nth-child(2){animation-delay:.06s} .wave-bars .bar:nth-child(3){animation-delay:.12s} .wave-bars .bar:nth-child(4){animation-delay:.18s} .wave-bars .bar:nth-child(5){animation-delay:.24s} .wave-bars .bar:nth-child(6){animation-delay:.18s} .wave-bars .bar:nth-child(7){animation-delay:.12s} .wave-bars .bar:nth-child(8){animation-delay:.06s}

        .call-buttons { display: flex; gap: 20px; margin-top: 20px; }
        .call-btn-start { width: 70px; height: 70px; border-radius: 50%; border: none; background: linear-gradient(135deg, #00ff88, #00cc6a); color: #0a0a0a; font-size: 1.8em; cursor: pointer; box-shadow: 0 4px 20px #00ff8840; transition: all 0.2s; }
        .call-btn-start:active { transform: scale(0.95); }
        .call-btn-start.active { background: linear-gradient(135deg, #ff4444, #cc0000); box-shadow: 0 4px 20px #ff444440; }
        
        .call-btn-end { width: 70px; height: 70px; border-radius: 50%; border: none; background: #333; color: #888; font-size: 1.8em; cursor: not-allowed; transition: all 0.2s; }
        .call-btn-end.active { background: linear-gradient(135deg, #ff4444, #cc0000); color: #fff; cursor: pointer; box-shadow: 0 4px 20px #ff444440; }

        /* ─── CHAT MODE ─── */
        .chat-area { display: none; flex: 1; flex-direction: column; }
        .chat-area.active { display: flex; }
        .header { display: flex; align-items: center; padding: 12px 16px; background: #111; border-bottom: 1px solid #222; gap: 10px; }
        .header .avatar { font-size: 1.8em; }
        .header .info h2 { font-size: 1em; color: #fff; }
        .tab-btn { padding: 6px 14px; border: 1px solid #333; border-radius: 20px; background: transparent; color: #888; font-size: 0.75em; cursor: pointer; }
        .tab-btn.active { border-color: #00ff88; color: #00ff88; background: #00ff8815; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9em; line-height: 1.4; animation: msgIn 0.3s ease-out; word-wrap: break-word; }
        @keyframes msgIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .msg.user { align-self: flex-end; background: #00ff88; color: #0a0a0a; border-bottom-right-radius: 4px; }
        .msg.bot { align-self: flex-start; background: #1e1e3a; color: #e0e0e0; border-bottom-left-radius: 4px; }
        .msg .time { font-size: 0.65em; opacity: 0.5; margin-top: 4px; }
        .input-area { display: flex; align-items: center; padding: 10px 12px; background: #111; border-top: 1px solid #222; gap: 8px; }
        .input-area input { flex: 1; padding: 12px 16px; border: 1px solid #333; border-radius: 24px; background: #1a1a2e; color: #fff; font-size: 0.9em; outline: none; }
        .input-area input:focus { border-color: #00ff88; }
        .send-btn { width: 44px; height: 44px; border: none; border-radius: 50%; background: #00ff88; color: #0a0a0a; font-size: 1.1em; cursor: pointer; }
    </style>
</head>
<body>

<div class="login-screen" id="loginScreen">
    <div class="avatar">📚</div>
    <h1>MaxChat</h1>
    <p>Llamada de voz con IA</p>
    <input class="login-input" id="nameInput" placeholder="Tu nombre..." maxlength="20" autofocus>
    <button class="login-btn" id="loginBtn">Entrar</button>
</div>

<div class="main-screen" id="mainScreen">
    <div class="header">
        <div class="avatar">📚</div>
        <div class="info"><h2>Max</h2></div>
        <button class="tab-btn active" id="callTab">📞 Llamar</button>
        <button class="tab-btn" id="chatTab">💬 Chat</button>
    </div>

    <!-- CALL SCREEN -->
    <div class="call-screen" id="callScreen">
        <div class="call-avatar" id="callAvatar">📚</div>
        <div class="call-status" id="callStatus">Toca 📞 para llamar</div>
        <div class="wave-bars" id="waveBars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <div class="transcript-box" id="transcriptBox"></div>
        <div class="reply-box" id="replyBox"></div>
        <div class="call-buttons">
            <button class="call-btn-start" id="startCallBtn">📞</button>
            <button class="call-btn-end" id="endCallBtn">📵</button>
        </div>
    </div>

    <!-- CHAT SCREEN -->
    <div class="chat-area" id="chatArea">
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input id="msgInput" placeholder="Escribe un mensaje...">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
    </div>
</div>

<script>
const SERVER_URL = window.location.origin;
let userName = '';
let socket = null;
let inCall = false;
let mediaStream = null;
let mediaRecorder = null;
let audioProcessor = null;
let audioContext = null;
let analyser = null;
let silenceTimer = null;
let isSpeaking = false;
let chunkCount = 0;
let currentAudio = null;

const loginScreen = document.getElementById('loginScreen');
const mainScreen = document.getElementById('mainScreen');
const nameInput = document.getElementById('nameInput');
const loginBtn = document.getElementById('loginBtn');
const callScreen = document.getElementById('callScreen');
const chatArea = document.getElementById('chatArea');
const callTab = document.getElementById('callTab');
const chatTab = document.getElementById('chatTab');
const callAvatar = document.getElementById('callAvatar');
const callStatus = document.getElementById('callStatus');
const waveBars = document.getElementById('waveBars');
const transcriptBox = document.getElementById('transcriptBox');
const replyBox = document.getElementById('replyBox');
const startCallBtn = document.getElementById('startCallBtn');
const endCallBtn = document.getElementById('endCallBtn');
const messagesEl = document.getElementById('messages');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

// ─── LOGIN ───
loginBtn.onclick = () => {
    const name = nameInput.value.trim();
    if (!name) return;
    userName = name;
    localStorage.setItem('maxchat_user', name);
    loginScreen.style.display = 'none';
    mainScreen.classList.add('active');
};
nameInput.onkeydown = e => { if(e.key==='Enter') loginBtn.click(); };
const saved = localStorage.getItem('maxchat_user');
if (saved) { nameInput.value = saved; loginBtn.click(); }

// ─── TABS ───
callTab.onclick = () => {
    callTab.classList.add('active'); chatTab.classList.remove('active');
    callScreen.style.display = 'flex'; chatArea.classList.remove('active');
};
chatTab.onclick = () => {
    chatTab.classList.add('active'); callTab.classList.remove('active');
    chatArea.classList.add('active'); callScreen.style.display = 'none';
    if (inCall) endCall();
};

// ─── SOCKET.IO ───
function connectSocket() {
    socket = io(SERVER_URL, { transports: ['websocket','polling'], timeout: 10000 });
    socket.on('connect', () => { socket.emit('user:join', userName); });
    
    socket.on('voice:call-started', () => {
        callStatus.textContent = '🎤 Escuchando...';
        callStatus.className = 'call-status listening';
        waveBars.className = 'wave-bars active';
        callAvatar.className = 'call-avatar listening';
    });
    
    socket.on('voice:status', (data) => {
        callStatus.textContent = data.text || '';
        const s = data.status;
        if (s === 'listening') {
            callStatus.className = 'call-status listening';
            waveBars.className = 'wave-bars active';
            callAvatar.className = 'call-avatar listening';
            startRecording(); // Resume recording after AI finishes
        } else if (s === 'transcribing') {
            callStatus.className = 'call-status thinking';
            waveBars.className = 'wave-bars';
            callAvatar.className = 'call-avatar';
        } else if (s === 'thinking') {
            callStatus.className = 'call-status thinking';
            waveBars.className = 'wave-bars';
            callAvatar.className = 'call-avatar';
        } else if (s === 'speaking') {
            callStatus.className = 'call-status speaking';
            waveBars.className = 'wave-bars speaking';
            callAvatar.className = 'call-avatar speaking';
            stopRecording(); // Stop recording while AI speaks
        }
    });
    
    socket.on('voice:transcript', (data) => {
        transcriptBox.textContent = '🎙️ ' + data.text;
        transcriptBox.classList.add('visible');
        addMsg('user', '🎙️ ' + data.text);
    });
    
    socket.on('voice:reply', (data) => {
        replyBox.textContent = data.text;
        replyBox.classList.add('visible');
        addMsg('bot', data.text);
    });
    
    socket.on('voice:audio', (data) => {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const audio = new Audio('data:audio/mp3;base64,' + data.audio);
        currentAudio = audio;
        audio.onended = () => { currentAudio = null; };
        audio.play().catch(e => console.error('Audio play error:', e));
    });
    
    socket.on('voice:call-ended', () => {
        inCall = false;
        callStatus.textContent = 'Toca 📞 para llamar';
        callStatus.className = 'call-status';
        waveBars.className = 'wave-bars';
        callAvatar.className = 'call-avatar';
        transcriptBox.classList.remove('visible');
        replyBox.classList.remove('visible');
        startCallBtn.textContent = '📞';
        startCallBtn.className = 'call-btn-start';
        endCallBtn.className = 'call-btn-end';
    });
    
    socket.on('chat:reply', (data) => {
        addMsg('bot', data.text || data.reply);
    });
}

// ─── VOICE CALL ───
startCallBtn.onclick = startCall;
endCallBtn.onclick = endCall;

async function startCall() {
    if (inCall) return;
    inCall = true;
    startCallBtn.className = 'call-btn-start active';
    startCallBtn.textContent = '📞';
    endCallBtn.className = 'call-btn-end active';
    callStatus.textContent = '🎤 Conectando...';
    transcriptBox.classList.remove('visible');
    replyBox.classList.remove('visible');
    
    try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
        });
        
        if (!socket || !socket.connected) connectSocket();
        socket.emit('voice:start-call');
        
        // Start recording and silence detection
        startRecording();
        startSilenceDetection();
        
    } catch(e) {
        alert('Micrófono: ' + e.message);
        endCall();
    }
}

function startRecording() {
    if (!mediaStream || !inCall) return;
    
    // Stop previous recorder if any
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
    
    chunkCount = 0;
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    mediaRecorder = new MediaRecorder(mediaStream, { mimeType });
    
    mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0 && inCall) {
            // Convert chunk to base64 and send
            const reader = new FileReader();
            reader.onloadend = () => {
                const b64 = reader.result.split(',')[1];
                if (socket && socket.connected) {
                    socket.emit('voice:audio-chunk', b64);
                }
            };
            reader.readAsDataURL(e.data);
        }
    };
    
    // Send chunks every 500ms for real-time streaming
    mediaRecorder.start(500);
}

function stopRecording() {
    if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
    }
}

function startSilenceDetection() {
    if (!mediaStream || !inCall) return;
    
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioContext.createMediaStreamSource(mediaStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;
    source.connect(analyser);
    
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    let speaking = false;
    let silenceStart = Date.now();
    let speechChunks = 0;
    
    function detect() {
        if (!inCall) return;
        
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        
        const isSpeakingNow = avg > 15; // Threshold
        
        if (isSpeakingNow) {
            if (!speaking) {
                speaking = true;
                silenceStart = Date.now();
                callStatus.textContent = '🎤 Te escucho...';
                callStatus.className = 'call-status recording';
                waveBars.className = 'wave-bars active';
            }
            silenceStart = Date.now();
        } else if (speaking) {
            // Silence detected after speech
            if (Date.now() - silenceStart > 1500) {
                // 1.5 seconds of silence = end of utterance
                speaking = false;
                callStatus.textContent = 'Procesando...';
                callStatus.className = 'call-status thinking';
                waveBars.className = 'wave-bars';
                // Tell server to process accumulated audio
                if (socket && socket.connected) {
                    socket.emit('voice:end-utterance');
                }
            }
        }
        
        requestAnimationFrame(detect);
    }
    
    detect();
}

function endCall() {
    inCall = false;
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    stopRecording();
    
    if (audioContext) { audioContext.close(); audioContext = null; }
    if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
    
    if (socket && socket.connected) {
        socket.emit('voice:end-call');
    }
}

// ─── CHAT ───
sendBtn.onclick = sendMsg;
msgInput.onkeydown = e => { if(e.key==='Enter') sendMsg(); };

function sendMsg() {
    const text = msgInput.value.trim();
    if (!text) return;
    addMsg('user', text);
    msgInput.value = '';
    
    if (!socket || !socket.connected) connectSocket();
    socket.emit('chat:message', { message: text });
}

function addMsg(type, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + type;
    const t = new Date();
    d.innerHTML = text + '<div class="time">' + t.getHours().toString().padStart(2,'0') + ':' + t.getMinutes().toString().padStart(2,'0') + '</div>';
    messagesEl.appendChild(d);
    messagesEl.scrollTop = messagesEl.scrollHeight;
}

// Auto-connect
setTimeout(() => { if (!socket) connectSocket(); }, 500);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
